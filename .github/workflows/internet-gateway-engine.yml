name: Encrypted Internet Gateway Engine

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'gateway/session-trigger.txt'

permissions:
  contents: write

jobs:
  gateway:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout engine
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Create ephemeral session key
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p gateway
          SESSION_ID="run-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          echo "$SESSION_ID" > /tmp/session-id
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:3072 -out /tmp/gateway-private.pem 2>/dev/null
          openssl pkey -in /tmp/gateway-private.pem -pubout -out gateway/session-public.pem
          python3 - <<'PY'
          import json, os
          sid=open('/tmp/session-id', encoding='utf-8').read().strip()
          with open('gateway/session.json','w',encoding='utf-8') as f:
              json.dump({'session_id':sid,'status':'ready','run_id':os.environ['GITHUB_RUN_ID']},f,indent=2)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add gateway/session-public.pem gateway/session.json
          git commit -m "gateway session ${SESSION_ID} ready"
          git push origin HEAD:main

      - name: Wait for encrypted request
        shell: bash
        run: |
          set -euo pipefail
          SESSION_ID="$(cat /tmp/session-id)"
          rm -f /tmp/request.enc.json
          for _ in $(seq 1 150); do
            git fetch --quiet origin main
            if git show origin/main:gateway/request.enc.json > /tmp/request.candidate.json 2>/dev/null; then
              if python3 - "$SESSION_ID" <<'PY'
          import json,sys
          try:
              d=json.load(open('/tmp/request.candidate.json',encoding='utf-8'))
          except Exception:
              raise SystemExit(1)
          raise SystemExit(0 if d.get('session_id')==sys.argv[1] else 1)
          PY
              then
                mv /tmp/request.candidate.json /tmp/request.enc.json
                exit 0
              fi
            fi
            sleep 2
          done
          echo 'No encrypted request arrived for this session.' >&2
          exit 124

      - name: Decrypt, validate and execute curl
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, hashlib, hmac, ipaddress, json, socket, subprocess, urllib.parse
          pkg=json.load(open('/tmp/request.enc.json',encoding='utf-8'))
          enc_key=base64.b64decode(pkg['encrypted_key_b64'])
          iv=base64.b64decode(pkg['iv_b64'])
          ciphertext=base64.b64decode(pkg['ciphertext_b64'])
          supplied_mac=base64.b64decode(pkg['hmac_b64'])
          open('/tmp/key.enc','wb').write(enc_key)
          subprocess.run(['openssl','pkeyutl','-decrypt','-inkey','/tmp/gateway-private.pem','-pkeyopt','rsa_padding_mode:oaep','-pkeyopt','rsa_oaep_md:sha256','-in','/tmp/key.enc','-out','/tmp/session-key.bin'],check=True,stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL)
          keymat=open('/tmp/session-key.bin','rb').read()
          if len(keymat)!=64:
              raise SystemExit('Invalid session key material')
          aes_key,mac_key=keymat[:32],keymat[32:]
          expected=hmac.new(mac_key,iv+ciphertext,hashlib.sha256).digest()
          if not hmac.compare_digest(expected,supplied_mac):
              raise SystemExit('Request authentication failed')
          plain=subprocess.run(['openssl','enc','-d','-aes-256-cbc','-nosalt','-K',aes_key.hex(),'-iv',iv.hex()],input=ciphertext,capture_output=True,check=True).stdout
          req=json.loads(plain.decode('utf-8'))
          request_id=str(req.get('request_id') or '')
          method=str(req.get('method') or 'GET').upper()
          url=str(req.get('url') or '')
          headers=req.get('headers') or {}
          body=req.get('body','')
          timeout=int(req.get('timeout_seconds',120))
          if method not in {'GET','POST','PUT','PATCH','DELETE','HEAD'}:
              raise SystemExit('Unsupported HTTP method')
          p=urllib.parse.urlparse(url)
          if p.scheme!='https' or not p.hostname:
              raise SystemExit('Only HTTPS URLs are allowed')
          if not isinstance(headers,dict):
              raise SystemExit('headers must be an object')
          if timeout < 1 or timeout > 300:
              raise SystemExit('timeout_seconds must be 1..300')
          for name,value in headers.items():
              if not str(name) or '\r' in str(name)+str(value) or '\n' in str(name)+str(value):
                  raise SystemExit('Invalid header')
          try:
              for info in socket.getaddrinfo(p.hostname,p.port or 443,type=socket.SOCK_STREAM):
                  ip=ipaddress.ip_address(info[4][0])
                  if ip.is_private or ip.is_loopback or ip.is_link_local or ip.is_multicast or ip.is_reserved or ip.is_unspecified:
                      raise SystemExit('Private/local network targets are blocked')
          except socket.gaierror:
              raise SystemExit('DNS resolution failed')
          if body is None:
              body=b''
          elif isinstance(body,str):
              body=body.encode('utf-8')
          else:
              body=json.dumps(body,ensure_ascii=False,separators=(',',':')).encode('utf-8')
          open('/tmp/request-body.bin','wb').write(body)
          args=['curl','--silent','--show-error','--location','--proto','=https','--proto-redir','=https','--retry','2','--retry-all-errors','--connect-timeout','20','--max-time',str(timeout),'--request',method,'--dump-header','/tmp/response-headers.txt','--output','/tmp/response-body.bin','--write-out','%{http_code}\n%{content_type}\n%{size_download}\n%{url_effective}\n']
          for name,value in headers.items():
              args += ['--header',f'{name}: {value}']
          if body:
              args += ['--data-binary','@/tmp/request-body.bin']
          args += ['--',url]
          proc=subprocess.run(args,text=True,capture_output=True)
          open('/tmp/curl-stderr.txt','w',encoding='utf-8').write(proc.stderr)
          lines=proc.stdout.splitlines()
          meta={'request_id':request_id,'curl_exit_code':proc.returncode,'http_status':int(lines[0]) if len(lines)>0 and lines[0].isdigit() else None,'content_type':lines[1] if len(lines)>1 and lines[1] else None,'size_download':float(lines[2]) if len(lines)>2 and lines[2] else None,'effective_url':lines[3] if len(lines)>3 else None}
          json.dump(meta,open('/tmp/response-meta.json','w',encoding='utf-8'),indent=2)
          PY
          tar -C /tmp -czf /tmp/gateway-response.tar.gz response-meta.json response-headers.txt response-body.bin curl-stderr.txt

      - name: Encrypt response
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, hashlib, hmac, json, os, subprocess
          keymat=open('/tmp/session-key.bin','rb').read()
          aes_key,mac_key=keymat[:32],keymat[32:]
          iv=os.urandom(16)
          plain=open('/tmp/gateway-response.tar.gz','rb').read()
          ciphertext=subprocess.run(['openssl','enc','-aes-256-cbc','-nosalt','-K',aes_key.hex(),'-iv',iv.hex()],input=plain,capture_output=True,check=True).stdout
          mac=hmac.new(mac_key,iv+ciphertext,hashlib.sha256).digest()
          open('gateway-response.enc','wb').write(ciphertext)
          meta=json.load(open('/tmp/response-meta.json',encoding='utf-8'))
          envelope={'session_id':open('/tmp/session-id',encoding='utf-8').read().strip(),'request_id':meta.get('request_id'),'iv_b64':base64.b64encode(iv).decode('ascii'),'hmac_b64':base64.b64encode(mac).decode('ascii')}
          json.dump(envelope,open('gateway-response-envelope.json','w',encoding='utf-8'),indent=2)
          PY

      - name: Upload encrypted response
        uses: actions/upload-artifact@v4
        with:
          name: encrypted-gateway-response-${{ github.run_id }}
          path: |
            gateway-response.enc
            gateway-response-envelope.json
          retention-days: 1
          if-no-files-found: error

      - name: Mark session complete
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          SESSION_ID="$(cat /tmp/session-id 2>/dev/null || true)"
          [ -n "$SESSION_ID" ] || exit 0
          git fetch --quiet origin main
          git reset --hard origin/main >/dev/null
          python3 - <<'PY'
          import json,os
          path='gateway/session.json'
          try:
              d=json.load(open(path,encoding='utf-8'))
          except Exception:
              d={}
          d['status']='complete'
          d['run_id']=os.environ['GITHUB_RUN_ID']
          json.dump(d,open(path,'w',encoding='utf-8'),indent=2)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add gateway/session.json
          if ! git diff --cached --quiet; then
            git commit -m "gateway session ${SESSION_ID} complete"
            git push origin HEAD:main
          fi
