name: Runner Diagnostic

on:
  pull_request:
    branches: [main]
    paths:
      - 'runner-diagnostic-trigger.txt'

permissions:
  contents: read

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify runner and POST
        shell: bash
        run: |
          uname -a
          curl --version
          curl --fail-with-body --silent --show-error --location \
            -X POST \
            -H 'Content-Type: application/json' \
            --data '{"diagnostic":"public-repo","ok":true}' \
            https://httpbin.org/post \
            -o runner-response.json
          cat runner-response.json
